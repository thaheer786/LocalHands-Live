<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Information Form</title>
  <link rel="stylesheet" href="form.css" />
</head>

<body>
  <!-- White overlay to improve text readability -->
  <div class="overlay"></div>

  <div class="form-container">
    <h2>Provider Information Form</h2>
    <form id="userForm" onsubmit="return validateForm()" enctype="multipart/form-data">
      <label for="first_name">First Name</label>
      <input type="text" id="first_name" name="first_name" required />

      <label for="last_name">Last Name</label>
      <input type="text" id="last_name" name="last_name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required />

      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3" required></textarea>

      <label for="occupation">Job Title</label>
      <input type="text" id="occupation" name="occupation" required />

      <label for="image">Upload Image</label>
      <div class="image-upload-wrapper">
        <input type="file" id="image" name="image" accept="image/*" required onchange="showTick()" />
        <span id="image-tick" class="tick-icon" style="display: none">&#10004;</span>
      </div>

      <label for="password">Set Password</label>
      <input type="password" id="password" name="password" pattern=".{6,}"
        title="Password must be at least 6 characters" required />

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required />

      <p id="error-message" style="color: red"></p>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    function validateForm() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      const errorMessage = document.getElementById("error-message");

      if (password !== confirmPassword) {
        errorMessage.textContent = "Passwords do not match!";
        return false;
      }

      alert("Form submitted successfully!");
      return true;
    }

    function showTick() {
      const imageInput = document.getElementById("image");
      const tickIcon = document.getElementById("image-tick");

      if (imageInput.files.length > 0) {
        tickIcon.style.display = "inline-block";
      } else {
        tickIcon.style.display = "none";
      }
    }
  </script>
</body>

</html>
