<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Provider Locator - Local Hands</title>
  <link rel="stylesheet" href="myStyle.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .map-container {
      display: grid;
      grid-template-columns: 380px 1fr;
      height: calc(100vh - 75px);
    }
    @media (max-width: 900px) {
      .map-container {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
    .map-sidebar {
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .map-view {
      position: relative;
      background: #F4E7D3;
      background-image: radial-gradient(var(--border-color) 1.5px, transparent 0);
      background-size: 24px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .map-pin {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      border: 3px solid #ffffff;
      box-shadow: var(--shadow-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .map-pin:hover {
      transform: scale(1.25);
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="assets/localhandsicon.jpg" alt="Logo" style="border-radius: 8px;" />
      <span>Local <em style="color: var(--primary); font-style: normal;">Hands</em></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="Allservices.html">All Services</a></li>
      <li><a href="maps.html" class="active">Find Providers</a></li>
      <li><a href="customer-dashboard.html">Booking Status</a></li>
    </ul>
    <div class="nav-actions" id="nav-actions-container"></div>
  </header>

  <!-- Interactive Map Split View -->
  <div class="map-container">
    <!-- Sidebar: Provider Filters & Cards -->
    <div class="map-sidebar">
      <div>
        <h2 style="font-size: 1.3rem; margin-bottom: 0.5rem; color: var(--secondary);">NEARBY <span class="text-gradient">SERVICE PROS</span></h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Verified professionals in your neighborhood ready to dispatch.</p>
        
        <input type="text" id="map-search-input" class="form-control" placeholder="Search provider name..." oninput="MapsApp.filterProviders()" />
      </div>

      <div id="map-provider-list" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="skeleton" style="height: 120px;"></div>
        <div class="skeleton" style="height: 120px;"></div>
      </div>
    </div>

    <!-- Map Canvas Visualization -->
    <div class="map-view" id="map-canvas">
      <!-- Simulated Interactive Map Grid Pins -->
      <div style="position: absolute; top: 1.5rem; left: 1.5rem; z-index: 10; background: var(--bg-surface); padding: 0.75rem 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
        <i class="fas fa-crosshairs" style="color: var(--primary);"></i> <strong style="color: var(--secondary);">Springfield Metro Area</strong>
        <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">Showing 5 Active Service Technicians</span>
      </div>

      <!-- Pins injected dynamically by js/maps.js -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/maps.js"></script>
</body>
</html>
